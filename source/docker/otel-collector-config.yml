receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  # Export to Jaeger
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Export to Elasticsearch for logs
  elasticsearch/logs:
    endpoints:
      - http://elasticsearch:9200
    logs_index: otel-logs

  # Export to Elasticsearch for traces  
  elasticsearch/traces:
    endpoints:
      - http://elasticsearch:9200
    traces_index: otel-traces

  # Debug exporter for troubleshooting
  logging:
    loglevel: info

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, elasticsearch/traces, logging]
    
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
    
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch/logs, logging]

